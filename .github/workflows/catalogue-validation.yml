# CODE MAP / COMMENTING GUIDE
# File purpose: GitHub Actions -työnkulku katalogin validointiin ja Python-yksikkötestien suorittamiseen.
# Structure: on = workflow triggers; jobs = tasks; steps = individual actions to execute.
# Change workflow steps one at a time and preserve YAML indentation.

name: Catalogue validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
# JOB STRUCTURE: the tasks and their individual steps are defined below.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate catalogue and run unit tests
        env:
          PYTHONPATH: src
        run: |
          python scripts/validate_catalog.py
          python -m unittest discover -s tests -v
