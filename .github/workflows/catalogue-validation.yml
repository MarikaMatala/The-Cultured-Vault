# KOMMENTOINTIOHJE / CODE MAP
# Tiedoston tarkoitus: GitHub Actions -työnkulku katalogin validointiin ja Python-yksikkötestien suorittamiseen.
# Rakenne: on = tapahtumat, jotka käynnistävät työnkulun; jobs = työt; steps = yksittäiset suoritettavat vaiheet.
# Muuta vaiheita yksi kerrallaan ja säilytä YAML-sisennys.

name: Catalogue validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
# TYÖVAIHEEN RAKENNE: alla määritellään suoritettavat tehtävät tai niiden vaiheet.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate catalogue and run unit tests
        env:
          PYTHONPATH: src
        run: |
          python scripts/validate_catalog.py
          python -m unittest discover -s tests -v
