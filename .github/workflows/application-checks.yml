# KOMMENTOINTIOHJE / CODE MAP
# Tiedoston tarkoitus: GitHub Actions -työnkulku sovelluksen riippuvuuksien, TypeScript-koodin ja tuotantokoontiversion tarkistamiseen.
# Rakenne: on = tapahtumat, jotka käynnistävät työnkulun; jobs = työt; steps = yksittäiset suoritettavat vaiheet.
# Muuta vaiheita yksi kerrallaan ja säilytä YAML-sisennys.

name: Application checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
# TYÖVAIHEEN RAKENNE: alla määritellään suoritettavat tehtävät tai niiden vaiheet.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Format source files
        run: npm run format

      - name: Export formatted source for review
        run: |
          for file in components/vault-app.tsx docs/APP_SETUP.md README.md README.fi.md; do
            printf 'FORMATTED_FILE:%s\n' "$file"
            base64 -w0 "$file"
            printf '\n'
          done

      - name: Run formatting, lint, type and catalogue tests
        run: npm run check

      - name: Build the application
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Validate catalogue and run Python unit tests
        env:
          PYTHONPATH: src
        run: |
          python scripts/validate_catalog.py
          python -m unittest discover -s tests -v
