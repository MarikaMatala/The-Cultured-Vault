name: Application checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Format source files
        run: npm run format

      - name: Export formatted source for review
        run: |
          for file in app/globals.css components/vault-app.tsx tsconfig.json docs/APP_SETUP.md README.md README.fi.md; do
            printf 'FORMATTED_FILE:%s\\n' "$file"
            base64 -w0 "$file"
            printf '\\n'
          done

      - name: Run formatting, lint, type and catalogue tests
        run: npm run check

      - name: Build the application
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate catalogue and run Python unit tests
        env:
          PYTHONPATH: src
        run: |
          python scripts/validate_catalog.py
          python -m unittest discover -s tests -v
